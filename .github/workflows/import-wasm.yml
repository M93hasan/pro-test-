name: Import Sparrow WASM

on:
  push:
    branches:
      - integrate-nesting-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate-nesting-v1
      - name: Check whether binaries already exist
        id: check
        run: |
          if [ -f wasm/pkg/sparrow_web_bg.wasm ] && [ -f wasm/pkg-nosimd/sparrow_web_bg.wasm ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Copy verified Sparrow binaries from source project
        if: steps.check.outputs.ready != 'true'
        run: |
          git clone --depth 1 https://github.com/M93hasan/nesting.git /tmp/nesting
          mkdir -p wasm/pkg wasm/pkg-nosimd
          cp /tmp/nesting/web/wasm/pkg/sparrow_web_bg.wasm wasm/pkg/sparrow_web_bg.wasm
          cp /tmp/nesting/web/wasm/pkg-nosimd/sparrow_web_bg.wasm wasm/pkg-nosimd/sparrow_web_bg.wasm
      - name: Commit imported binaries
        if: steps.check.outputs.ready != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wasm/pkg/sparrow_web_bg.wasm wasm/pkg-nosimd/sparrow_web_bg.wasm
          git commit -m "Import Sparrow WASM binaries [wasm-sync]"
          git push origin HEAD:integrate-nesting-v1
