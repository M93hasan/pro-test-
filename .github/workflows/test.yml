name: Test and build

on:
  push:
    branches:
      - main
      - integrate-nesting-v1
  pull_request:

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
